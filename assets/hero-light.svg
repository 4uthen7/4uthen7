<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="高本 / 4uthent — full-stack engineer">
  <title>高本 / 4uthent — full-stack engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F7F8FC"/>
      <stop offset="1" stop-color="#EFF1F8"/>
    </linearGradient>
    <radialGradient id="glowV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22B8D9" stop-opacity=".13"/>
      <stop offset="1" stop-color="#22B8D9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0C14"/>
      <stop offset=".58" stop-color="#14162B"/>
      <stop offset="1" stop-color="#4A3AA8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".35" stop-color="#7C5CFF" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset=".65" stop-color="#00C2E0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B3DF5" stop-opacity="0"/>
      <stop offset=".18" stop-color="#5B3DF5" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#0A9CB8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0A9CB8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D4FD6" stop-opacity="0"/>
      <stop offset=".72" stop-color="#4FC4E8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0D4FD6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B1D2A" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <mask id="mJP" maskUnits="userSpaceOnUse" x="0" y="40" width="1200" height="300">
      <text x="64" y="236" class="jpName" fill="#fff">高本</text>
    </mask>
    <mask id="mEN" maskUnits="userSpaceOnUse" x="0" y="40" width="1200" height="300">
      <text x="64" y="236" class="enName" fill="#fff">4uthent</text>
    </mask>

    <path id="signal" d="M 700 292 C 748 292 752 196 796 196 S 844 292 886 292 S 930 128 974 128 S 1022 232 1064 232 S 1104 186 1140 186"/>
  </defs>

  <style>
    .jpName{font-family:"Noto Sans JP Black","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:900;font-size:150px;letter-spacing:-3px}
    .enName{font-family:"Segoe UI Variable Display","Segoe UI Black","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:150px;letter-spacing:-5px}
    .mono{font-family:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,Menlo,monospace}
    .tagLine{font-family:"Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-weight:400;font-size:19px;letter-spacing:.8px}
    .micro{font-family:"Cascadia Mono","Consolas",ui-monospace,monospace;font-size:10.5px;letter-spacing:3.4px}

    .nameA{animation:nameA 9s cubic-bezier(.65,0,.35,1) infinite;transform-origin:64px 236px}
    .nameB{animation:nameB 9s cubic-bezier(.65,0,.35,1) infinite;transform-origin:64px 236px;opacity:0}
    @keyframes nameA{0%,38%{opacity:1;transform:translateY(0)}46%,100%{opacity:0;transform:translateY(-30px)}}
    @keyframes nameB{0%,44%{opacity:0;transform:translateY(30px)}52%,90%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(-24px)}}

    .sheenA{animation:sheen 9s linear infinite .2s}
    .sheenB{animation:sheen 9s linear infinite 4.95s}
    @keyframes sheen{
      0%{transform:translateX(-360px);opacity:0}
      6%{opacity:1}
      26%{transform:translateX(1080px);opacity:1}
      27%,100%{transform:translateX(1080px);opacity:0}
    }

    .glitchC{animation:glitchC 7.6s steps(1,end) infinite;opacity:0}
    .glitchM{animation:glitchM 7.6s steps(1,end) infinite;opacity:0}
    @keyframes glitchC{
      0%,93%,100%{opacity:0;transform:translate(0,0)}
      94%{opacity:.5;transform:translate(3px,-2px)}
      96%{opacity:.28;transform:translate(-3px,1px)}
      98%{opacity:.42;transform:translate(2px,2px)}
    }
    @keyframes glitchM{
      0%,93%,100%{opacity:0;transform:translate(0,0)}
      94%{opacity:.4;transform:translate(-3px,2px)}
      96%{opacity:.24;transform:translate(3px,-1px)}
      98%{opacity:.34;transform:translate(-2px,-2px)}
    }

    .tw{animation:twIn .12s linear both}
    @keyframes twIn{from{opacity:0}to{opacity:1}}

    .caret{animation:blink 1.15s steps(1,end) 1.95s infinite;opacity:0}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

    .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .introName{animation:introName 1.2s cubic-bezier(.16,1,.3,1) both .1s;transform-origin:64px 236px}
    @keyframes introName{from{opacity:0;transform:translateY(34px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}

    .node{animation:node 2.6s ease-in-out infinite}
    @keyframes node{0%,100%{opacity:.35}45%{opacity:1}}

    .travel{animation:travel 4.4s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}88%{opacity:1}100%{transform:translateX(600px);opacity:0}}

    .comet{animation:comet 4.2s cubic-bezier(.45,0,.55,1) infinite;stroke-dasharray:70 1300}
    @keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-1300}}

    .marquee{animation:marquee 26s linear infinite}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-1136px)}}

    .scan{animation:scan 7s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(-140px);opacity:0}14%{opacity:.16}60%{opacity:.1}100%{transform:translateY(500px);opacity:0}}

    .pulse{animation:pulse 2.3s ease-in-out infinite;transform-origin:66px 52px}
    @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(2.1)}}

    .dust{animation:dust 11s linear infinite;opacity:0}
    @keyframes dust{
      0%{transform:translateY(24px);opacity:0}
      15%{opacity:.6}
      80%{opacity:.35}
      100%{transform:translateY(-70px);opacity:0}
    }

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .nameA{opacity:1;transform:none}
      .nameB,.sheenA,.sheenB,.glitchC,.glitchM,.scan,.dust{opacity:0}
      .caret{opacity:1}
    }
  </style>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <ellipse cx="890" cy="170" rx="430" ry="270" fill="url(#glowV)"/>
  <ellipse cx="1090" cy="330" rx="320" ry="210" fill="url(#glowC)"/>
  <rect width="1200" height="480" filter="url(#grain)" opacity=".025" style="mix-blend-mode:multiply"/>

  <g class="rise" style="animation-delay:.05s">
    <circle cx="66" cy="48" r="3.4" fill="#6E9B00"/>
    <circle class="pulse" cx="66" cy="48" r="3.4" fill="#6E9B00"/>
    <text x="82" y="52" class="micro" fill="#5E8A00" letter-spacing="2.8">OPEN TO BUILD</text>
    <text x="1136" y="52" class="micro" fill="#8A90A4" text-anchor="end">DESIGN → DEPLOY → REPEAT</text>
  </g>

  <g class="introName">
    <g class="nameA">
    <text x="64" y="236" class="jpName" fill="url(#ink)">高本</text>
    <g mask="url(#mJP)">
      <rect class="sheenA" x="0" y="40" width="420" height="300" fill="url(#sheen)"/>
    </g>
  </g>

  <g class="nameB">
    <text x="64" y="236" class="enName glitchC" fill="#00A6C4">4uthent</text>
    <text x="64" y="236" class="enName glitchM" fill="#FF2E7E">4uthent</text>
    <text x="64" y="236" class="enName" fill="url(#ink)">4uthent</text>
    <g mask="url(#mEN)">
      <rect class="sheenB" x="0" y="40" width="420" height="300" fill="url(#sheen)"/>
    </g>
  </g>
  </g>

  <g class="rise" style="animation-delay:.28s">
    <text x="64" y="284" class="mono" font-size="13.5" fill="#5C6274">@4uthen7</text>
    <rect x="158" y="274" width="1" height="13" fill="#5C6274" opacity=".35"/>
    <text x="174" y="284" class="mono" font-size="13.5" fill="#5C6274">FULL-STACK ENGINEER</text>
  </g>

  <text x="64" y="342" class="tagLine" fill="#22263A"><tspan class="tw" style="animation-delay:0.620s">設</tspan><tspan class="tw" style="animation-delay:0.662s">計</tspan><tspan class="tw" style="animation-delay:0.704s">か</tspan><tspan class="tw" style="animation-delay:0.746s">ら</tspan><tspan class="tw" style="animation-delay:0.788s">実</tspan><tspan class="tw" style="animation-delay:0.830s">装</tspan><tspan class="tw" style="animation-delay:0.872s">、</tspan><tspan class="tw" style="animation-delay:0.914s">デ</tspan><tspan class="tw" style="animation-delay:0.956s">プ</tspan><tspan class="tw" style="animation-delay:0.998s">ロ</tspan><tspan class="tw" style="animation-delay:1.040s">イ</tspan><tspan class="tw" style="animation-delay:1.082s">ま</tspan><tspan class="tw" style="animation-delay:1.124s">で</tspan><tspan class="tw" style="animation-delay:1.166s">。</tspan><tspan class="tw" style="animation-delay:1.208s">ひ</tspan><tspan class="tw" style="animation-delay:1.250s">と</tspan><tspan class="tw" style="animation-delay:1.292s">り</tspan><tspan class="tw" style="animation-delay:1.334s">で</tspan><tspan class="tw" style="animation-delay:1.376s">、</tspan><tspan class="tw" style="animation-delay:1.418s">最</tspan><tspan class="tw" style="animation-delay:1.460s">後</tspan><tspan class="tw" style="animation-delay:1.502s">ま</tspan><tspan class="tw" style="animation-delay:1.544s">で</tspan><tspan class="tw" style="animation-delay:1.586s">持</tspan><tspan class="tw" style="animation-delay:1.628s">っ</tspan><tspan class="tw" style="animation-delay:1.670s">て</tspan><tspan class="tw" style="animation-delay:1.712s">い</tspan><tspan class="tw" style="animation-delay:1.754s">く</tspan><tspan class="tw" style="animation-delay:1.796s">。</tspan></text>
  <rect class="caret" x="632" y="326" width="8" height="19" fill="#5B3DF5"/>

  <g class="rise" style="animation-delay:.5s">
    <line x1="64" y1="414" x2="700" y2="414" stroke="#D9DCE7" stroke-width="1"/>
    <g filter="url(#bloom)">
      <circle class="node" cx="64" cy="414" r="3" fill="#5B3DF5"/>
      <circle class="node" cx="200" cy="414" r="3" fill="#5B3DF5" style="animation-delay:.22s"/>
      <circle class="node" cx="330" cy="414" r="3" fill="#7A63F0" style="animation-delay:.44s"/>
      <circle class="node" cx="460" cy="414" r="3" fill="#0A9CB8" style="animation-delay:.66s"/>
      <circle class="node" cx="590" cy="414" r="3" fill="#0A9CB8" style="animation-delay:.88s"/>
      <circle class="node" cx="700" cy="414" r="3" fill="#6E9B00" style="animation-delay:1.1s"/>
    </g>
    <rect class="travel" x="64" y="413" width="64" height="2" fill="url(#wire)"/>

    <text x="64" y="400" class="micro" fill="#8C92A4" text-anchor="middle">PLAN</text>
    <text x="200" y="400" class="micro" fill="#8C92A4" text-anchor="middle">UI</text>
    <text x="330" y="400" class="micro" fill="#8C92A4" text-anchor="middle">API</text>
    <text x="460" y="400" class="micro" fill="#8C92A4" text-anchor="middle">DATA</text>
    <text x="590" y="400" class="micro" fill="#8C92A4" text-anchor="middle">INFRA</text>
    <text x="700" y="400" class="micro" fill="#8C92A4" text-anchor="middle">SHIP</text>
  </g>

  <g class="rise" style="animation-delay:.2s">
    <use href="#signal" fill="none" stroke="#E2E4EC" stroke-width="1.2"/>
    <use href="#signal" fill="none" stroke="url(#wire)" stroke-width="1.4" opacity=".9"/>
    <use href="#signal" fill="none" stroke="url(#comet)" stroke-width="2.4" stroke-linecap="round" class="comet" filter="url(#bloom)"/>
    <circle cx="974" cy="128" r="3.4" fill="#0A9CB8"/>
    <circle cx="1140" cy="186" r="2.6" fill="#6E9B00"/>
  </g>

  <g opacity=".55">
    <circle class="dust" cx="760" cy="250" r="1.6" fill="#5B3DF5" style="animation-delay:.4s"/>
    <circle class="dust" cx="905" cy="300" r="1.4" fill="#0A9CB8" style="animation-delay:2.6s"/>
    <circle class="dust" cx="1035" cy="180" r="1.8" fill="#5B3DF5" style="animation-delay:4.8s"/>
    <circle class="dust" cx="1120" cy="290" r="1.3" fill="#6E9B00" style="animation-delay:6.4s"/>
    <circle class="dust" cx="850" cy="150" r="1.2" fill="#0A9CB8" style="animation-delay:8.2s"/>
  </g>

  <g clip-path="url(#mqClip)" opacity=".55">
    <clipPath id="mqClip"><rect x="0" y="432" width="1200" height="40"/></clipPath>
    <g class="marquee">
      <text x="64" y="458" class="mono" font-size="11" fill="#8E93A6" letter-spacing="4" textLength="1136" lengthAdjust="spacing">TYPESCRIPT · REACT · NODE · ELECTRON · PYTHON · POWERSHELL · DISCORD API ·</text>
      <text x="1200" y="458" class="mono" font-size="11" fill="#8E93A6" letter-spacing="4" textLength="1136" lengthAdjust="spacing">TYPESCRIPT · REACT · NODE · ELECTRON · PYTHON · POWERSHELL · DISCORD API ·</text>
    </g>
  </g>

  <rect class="scan" x="0" y="0" width="1200" height="140" fill="#7C5CFF" opacity="0" style="filter:blur(40px);mix-blend-mode:multiply"/>

  <rect x=".5" y=".5" width="1199" height="479" fill="none" stroke="#0B0C12" stroke-opacity=".08"/>
</svg>
